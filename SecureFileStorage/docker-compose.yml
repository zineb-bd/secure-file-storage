version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securefilestorage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:latest
    container_name: sfs-clamav
    ports:
      - "3310:3310"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfs-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=securefilestorage;Username=postgres;Password=postgres"
      Antivirus__Enabled: "true"
      Antivirus__ClamAvHost: clamav
    depends_on:
      - postgres
      - clamav
    volumes:
      - storage_data:/app/storage

volumes:
  postgres_data:
  storage_data:
