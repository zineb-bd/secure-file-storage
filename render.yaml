# Blueprint Render — API SecureDocs (Docker)
# Frontend reste sur Vercel. Postgres : Neon (gratuit) recommandé.
# Déploiement : https://dashboard.render.com/blueprint/new?repo=https://github.com/zineb-bd/secure-file-storage

services:
  - type: web
    name: securedocs-api
    runtime: docker
    plan: free
    rootDir: SecureFileStorage
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSql
      - key: Database__ConnectionString
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: SecureFileStorage
      - key: Jwt__Audience
        value: SecureFileStorageClients
      - key: Jwt__ExpirationMinutes
        value: "60"
      - key: Encryption__MasterKey
        generateValue: true
      - key: Storage__Provider
        value: LocalFileSystem
      - key: Storage__BasePath
        value: /app/storage
      - key: Antivirus__Enabled
        value: "false"
      - key: Chatbot__Enabled
        value: "false"
